<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workroom · 团队协作</title><meta name="description" content="AI powered 企业 IM 交互原型"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%233370ff'/%3E%3Cpath d='m7 10 4 13 5-9 5 9 4-13' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head><body><div class="shell"><aside class="rail"><div class="logo">w</div><button class="rail-item active" data-view="chat" aria-label="消息"><span data-icon="chat"></span><small>消息</small></button><button class="rail-item" data-view="knowledge" aria-label="知识库"><span data-icon="book"></span><small>知识库</small></button><div class="rail-bottom"><span class="avatar me">W</span></div></aside><aside class="sidebar"><div class="workspace"><strong>Workroom</strong><span class="workspace-tag">团队空间</span></div><div class="side-heading">消息 <span class="muted">⌄</span></div><div class="section-label">频道</div><nav id="channels"></nav><div class="section-label spaced">私信</div><nav id="direct"></nav><div class="side-footer"><span class="mini-spark">✦</span> 与团队一起，也与 AI 一起。</div></aside><main><header id="header"></header><div id="tabs"></div><section id="messages" role="log" aria-label="聊天消息" aria-live="polite"></section><section id="knowledge" hidden></section><div id="compose-area"><div class="suggestions"><span>试试让 Agent</span><button data-prompt="总结一下这个频道的讨论">总结讨论</button><button data-prompt="根据讨论更新产品需求文档">更新需求文档</button><button data-prompt="查找用户访谈记录">查找资料</button></div><form id="composer"><div id="mention-menu" hidden><button type="button" id="pick-agent"><span class="avatar agent small">✦</span><span><strong>Agent</strong><small>你的 AI 工作伙伴</small></span></button></div><textarea id="input" aria-label="消息内容" placeholder="发送消息，输入 @ 呼叫 Agent" rows="2"></textarea><div class="compose-bottom"><button type="button" id="mention" aria-label="提及 Agent">@</button><span class="compose-note">Enter 发送 · Shift + Enter 换行</span><button type="submit" id="send" aria-label="发送消息" disabled><span data-icon="send"></span></button></div></form><div class="prototype-note">交互原型 · Agent 回复与知识库均为演示数据 <button id="reset">重置演示</button></div></div></main></div><script src="app.js"></script></body></html>
